<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2A9D8F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Job Search">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>AI Job Search</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <h1 id="title">Pipeline</h1>
  <button class="icon-btn" id="searchToggle" aria-label="Search">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
  </button>
</header>
<div class="searchbar" id="searchbar" hidden>
  <input id="q" type="search" placeholder="Company, role, sector" autocomplete="off" enterkeyhint="search">
</div>
<main id="view" tabindex="-1"></main>
<button class="fab" id="fab" aria-label="Add application">+</button>
<nav class="tabs" id="tabs">
  <button data-tab="pipeline" class="on"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Pipeline</span></button>
  <button data-tab="deadlines"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg><span>Deadlines</span></button>
  <button data-tab="stats"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span>Stats</span></button>
  <button data-tab="data"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 20h14"/></svg><span>Data</span></button>
</nav>
<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file" accept=".csv,text/csv" hidden>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
